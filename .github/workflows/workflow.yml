name: Build task
on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: 0 0 * * *

permissions:
  contents: read

jobs:
  Build:
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set Node.JS
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 24.x

    - name: npm install
      run: npm install

    - name: Build
      run: npm run build

    - name: Run tests
      run: npm run test

    - name: Run Prettier
      run: npm run format-check

    - name: Lint
      run: npm run lint
