name: Test setup-xcode latest-stable version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          xcode-version: "latest-stable"

      - name: Assert action ran (succeeds on macOS, fails gracefully on Linux)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERSION: ${{ steps.action.outputs.version }}
          PATH_OUT: ${{ steps.action.outputs.path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "version: $VERSION"
          echo "path: $PATH_OUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$VERSION" ]; then
              echo "FAIL: action succeeded but 'version' output is empty"
              exit 1
            fi
            if [ -z "$PATH_OUT" ]; then
              echo "FAIL: action succeeded but 'path' output is empty"
              exit 1
            fi
            echo "PASS: latest-stable Xcode $VERSION selected at $PATH_OUT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on non-macOS platform)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
